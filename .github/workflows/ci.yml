name: ci

on:
  push:
    branches: [main]
    # Prose changes nothing a compiler or linter can check.
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]

# A new push supersedes any run still in progress for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A hanging test would otherwise consume the six-hour default; a cold build
    # plus the suite takes a few minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web-admin/package-lock.json
            web-theme/package-lock.json

      # rust-embed requires both dists to exist before cargo runs.
      - run: npm ci && npm run lint && npm test && npm run build
        working-directory: web-admin

      # The public theme is built here too, from the source in web-theme/. It
      # used to be a published archive fetched by scripts/theme.sh; that is now
      # a staging step, run below, and this is what puts something there to
      # stage.
      #
      # `dist/` is not committed -- the same as web-admin's -- so a stale one
      # cannot be the thing that gets shipped. `TZ=UTC` because the format tests
      # read clock times out of timestamps, and the runner is UTC while a
      # developer's machine is not; without it they pass here and fail there.
      - run: npm ci && npm run lint && TZ=UTC npm test && npm run build
        working-directory: web-theme

      # Stages web-theme/dist/ into target/theme/, where build.rs and rust-embed
      # look. Also what release.yml packs as the installable theme archive.
      - run: ./scripts/theme.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo fmt --manifest-path agent/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path agent/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path agent/Cargo.toml

      # Both installers run as root on the user's machine. Notes below warning
      # level are all SC2015 on `[ a ] && [ b ] || die`, which is meant to die
      # when either test fails.
      - run: shellcheck -S warning install.sh install-hub.sh scripts/*.sh

      # What the two installers decide rather than what they say: the order
      # their top-level code runs in, and the subscription port a re-run lands
      # on. Both are silent on a machine that already works and break one that
      # does not, so neither shows up until a fresh install or an upgrade.
      - run: scripts/install-test.sh
      - run: python3 scripts/subscription-state-test.py
      - run: python3 scripts/vpn-opt-in-test.py
      - run: python3 scripts/prompt-pty-test.py
      - run: python3 scripts/proxy-probe-test.py
      - run: python3 scripts/upgrade-idempotence-test.py
      - run: python3 scripts/proxy-install-test.py

      # This commit's hub against the latest agent we have released: the field
      # contract between a hub and an agent already running in the field, and
      # what the public view withholds. Ours, not another project's -- the
      # agent this hub ships beside is the one it has to keep talking to, and a
      # rename on either side is exactly the breakage this catches.
      - run: cargo build
      - run: cargo build --locked --manifest-path agent/Cargo.toml
      - run: python3 scripts/proxy-e2e.py target/debug/monitor-hub agent/target/debug/monitor-agent
      - run: |
          curl -fsSL --retry 3 -o target/released-monitor-agent https://github.com/Isyyyue/monitor/releases/latest/download/monitor-agent-x86_64-unknown-linux-musl
          chmod +x target/released-monitor-agent
      - run: scripts/e2e.sh target/debug/monitor-hub target/released-monitor-agent
