[package]
name = "monitor-agent"
version = "1.9.11"
edition = "2021"

[[bin]]
name = "monitor-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "fs"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
# --insecure 用：装一个接受任何证书的 verifier，给自签证书的 hub 用。
# 版本必须与 tokio-tungstenite 0.21 拉进来的那一个一致（它经 tokio-rustls 0.25
# 依赖 rustls 0.22），否则 `Connector::Rustls` 拿到的是另一个 ClientConfig 类型，
# 编译不过。
# 不带任何 feature：0.21 及更早要 `dangerous_configuration` 才放行 `dangerous()`，
# 0.22 起取消了那个开关（实测可用 feature 里没有它），直接用即可。
rustls = "0.22"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# default-features = false 关掉 `multithread`（也就是 Rayon）：开着时它按核数铺一池
# 工作线程，在一台 32 核的机器上就是 32 条常驻线程，只为采几个数字。这个 agent
# 一秒采一次，单线程绰绰有余。
sysinfo = { version = "0.30", default-features = false }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
libc = "0.2"
http = "1"
getrandom = "0.2"
# provision 用：订阅的 base64 与 REALITY 的 X25519 公钥推导。
# 两者都是纯 Rust，不引入 C 依赖，与仓库现有的 argon2/sha2/rand 风格一致。
base64 = "0.22"
x25519-dalek = { version = "2", features = ["static_secrets"] }
# hello 上报本机地址用。节点在反代后面时，hub 看到的来源是 127.0.0.1，
# 只有接口上的地址能确定国家。
if-addrs = "0.13"
# 订阅伺服跟着 agent 一起跑，不再单独常驻一个 Python 进程。
# axum 只挂一个只读路由；reqwest 只用来问 hub 要本节点的额度与用量。
# TLS 走 rustls，与 WebSocket 那条路一致，不引入 OpenSSL。
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# 只用来把 `2026-11-01` 换成订阅头里的 unix 时间戳。
chrono = { version = "0.4", default-features = false, features = ["std"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = 2
