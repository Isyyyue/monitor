[package]
name = "monitor-agent"
version = "1.5.0"
edition = "2021"

[[bin]]
name = "monitor-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
libc = "0.2"
http = "1"
getrandom = "0.2"
# provision 用：订阅的 base64 与 REALITY 的 X25519 公钥推导。
# 两者都是纯 Rust，不引入 C 依赖，与仓库现有的 argon2/sha2/rand 风格一致。
base64 = "0.22"
x25519-dalek = { version = "2", features = ["static_secrets"] }
# hello 上报本机地址用。节点在反代后面时，hub 看到的来源是 127.0.0.1，
# 只有接口上的地址能确定国家。
if-addrs = "0.13"
